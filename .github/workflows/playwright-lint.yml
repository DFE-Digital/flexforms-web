name: Playwright lint and format

on:
  pull_request:
    paths:
      - src/Tests/GovUK.Dfe.FlexForms.PlaywrightTests/**
      - .github/workflows/playwright-lint.yml
    types: [opened, synchronize]

concurrency:
  group: playwright-lint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-format:
    name: Lint and format
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src/Tests/GovUK.Dfe.FlexForms.PlaywrightTests
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/Tests/GovUK.Dfe.FlexForms.PlaywrightTests/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint
