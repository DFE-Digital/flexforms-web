name: Playwright lint and format

on:
  pull_request:
    paths:
      - src/Tests/GovUK.Dfe.FlexForms.PlaywrightTests/**
      - .github/workflows/playwright-lint.yml
    types: [opened, synchronize]

concurrency:
  group: playwright-lint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: Format check
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src/Tests/GovUK.Dfe.FlexForms.PlaywrightTests
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore GovUK.Dfe.FlexForms.PlaywrightTests.csproj

      - name: Check formatting
        run: dotnet format GovUK.Dfe.FlexForms.PlaywrightTests.csproj --verify-no-changes
