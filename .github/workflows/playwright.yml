name: Run Playwright tests
run-name: Playwright tests for '${{ inputs.environment }}'

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run tests against'
        required: true
        type: environment

concurrency:
  group: playwright-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  playwright-tests:
    name: Playwright
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: src/Tests/GovUK.Dfe.FlexForms.PlaywrightTests
    env:
      CI: true
      PW_ARTIFACTS_DIR: ${{ github.workspace }}/src/Tests/GovUK.Dfe.FlexForms.PlaywrightTests/test-results
      BASE_URL: ${{ vars.PL_BASE_URL}}
      API_BASE_URL: ${{ vars.PL_API_BASE_URL }}
      SERVICE: TestService
      TENANT_ID: 99999999-9999-1999-2999-999999999999
      TEMPLATE_ID: 22BC3831-734E-4F17-87AE-7993520039CE
      TERMINOLOGY_SINGULAR: Application
      TERMINOLOGY_PLURAL: Applications
      INTERNAL_AUTH_TOKEN_LIFETIME_MINUTES: 60
      DEFAULT_USER_EMAIL: ${{ secrets.PL_DEFAULT_USER_EMAIL }}
      DEFAULT_USER_API_KEY: ${{ secrets.PL_DEFAULT_USER_API_KEY }}
      ADMIN_EMAIL: ${{ secrets.PL_ADMIN_EMAIL }}
      ADMIN_API_KEY: ${{ secrets.PL_ADMIN_API_KEY }}
      CASEWORKER_EMAIL: ${{ secrets.PL_CASEWORKER_EMAIL }}
      CASEWORKER_API_KEY: ${{ secrets.PL_CASEWORKER_API_KEY }}
      JWT_SIGNING_KEY: ${{ secrets.PL_JWT_SIGNING_KEY }}
      INTERNAL_AUTH_ISSUER: ${{ secrets.PL_INTERNAL_AUTH_ISSUER }}
      INTERNAL_AUTH_AUDIENCE: ${{ secrets.PL_INTERNAL_AUTH_AUDIENCE }}
      AUTH_PROVIDER_API_KEY: ${{ secrets.PL_AUTH_PROVIDER_API_KEY }}
      FILE_VALIDATION_API_KEY: ${{ secrets.PL_FILE_VALIDATION_API_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore GovUK.Dfe.FlexForms.PlaywrightTests.csproj

      - name: Build
        run: dotnet build GovUK.Dfe.FlexForms.PlaywrightTests.csproj --no-restore

      - name: Install Playwright browser
        run: pwsh bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run Playwright tests
        run: >
          dotnet test GovUK.Dfe.FlexForms.PlaywrightTests.csproj --no-build
          --filter "Category=${{ env.SERVICE }}"
          --logger "trx;LogFileName=report.trx"
          --results-directory reports
          -- NUnit.NumberOfTestWorkers=4

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-${{ inputs.environment }}
          path: src/Tests/GovUK.Dfe.FlexForms.PlaywrightTests/reports
          retention-days: 14

      - name: Upload test results
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-results-${{ inputs.environment }}
          path: src/Tests/GovUK.Dfe.FlexForms.PlaywrightTests/test-results
          retention-days: 14

      - name: Report results to Teams
        if: always()
        run: pwsh scripts/Send-TeamsNotification.ps1
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.PL_TEAMS_WEBHOOK_URL }}
          ENVIRONMENT: ${{ inputs.environment }}
          INFORMATION_LINK: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
